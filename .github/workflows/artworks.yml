name: 作品画像を取得する

on:
  workflow_dispatch:
    inputs:
      force:
        description: 取得済みのものも取り直す
        type: boolean
        default: false
  push:
    branches: [ main, 'claude/**' ]
    paths:
      - 'data/art/**'
      - 'tools/fetch-artworks.mjs'

permissions:
  contents: write

concurrency:
  group: artworks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: マニフェストを束ねる
        run: node tools/merge.mjs

      - name: Wikimedia から画像を取得する
        run: node tools/fetch-artworks.mjs ${{ inputs.force && '--force' || '' }}

      - name: 画像の幅と画質をそろえる
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'EOF'
          from PIL import Image
          import glob, os
          Image.MAX_IMAGE_PIXELS = None
          MAXW, Q = 1800, 88
          before = after = 0
          for p in sorted(glob.glob("assets/artworks/*")):
              if os.path.isdir(p): continue
              ext = os.path.splitext(p)[1].lower()
              b = os.path.getsize(p); before += b
              if ext == '.svg':
                  after += b; continue
              try:
                  im = Image.open(p); w, h = im.size
                  changed = False
                  if w > MAXW:
                      im = im.resize((MAXW, round(h * MAXW / w)), Image.LANCZOS); changed = True
                  if im.mode not in ('RGB', 'L'):
                      im = im.convert('RGB'); changed = True
                  out = os.path.splitext(p)[0] + '.jpg'
                  if changed or b > 1500*1024 or ext != '.jpg':
                      im.save(out, 'JPEG', quality=Q, optimize=True, progressive=True)
                      if out != p: os.remove(p)
                  after += os.path.getsize(out)
              except Exception as e:
                  print('変換できず:', p, e); after += b
          print(f'{before/1e6:.0f}MB -> {after/1e6:.0f}MB')

          # 顔カードとギャラリーの札は画面上350pxほどしかない。
          # そこへ原寸を10枚並べると下のほうが出てこないので、縮小版も置く
          import pathlib
          pathlib.Path('assets/artworks/thumb').mkdir(parents=True, exist_ok=True)
          # 作り直すかどうかは、更新時刻ではなく中身のハッシュで決める。
          # checkout の時刻は画像の版を表さないので、原寸を差し替えても
          # 縮小版が古いまま残ることがあった。
          import hashlib, json as _json
          STAMP = 'assets/artworks/thumb/.source-hash.json'
          stamps = _json.load(open(STAMP)) if os.path.exists(STAMP) else {}
          def sha(path):
              h = hashlib.sha1()
              with open(path, 'rb') as f:
                  for chunk in iter(lambda: f.read(1 << 20), b''): h.update(chunk)
              return h.hexdigest()
          TW, TQ = 720, 80
          tn = 0
          for p in sorted(glob.glob('assets/artworks/*.jpg')):
              out = 'assets/artworks/thumb/' + os.path.basename(p)
              key = os.path.basename(p)
              digest = sha(p)
              if os.path.exists(out) and stamps.get(key) == digest:
                  continue
              stamps[key] = digest
              try:
                  im = Image.open(p); w, h = im.size
                  if w > TW: im = im.resize((TW, max(1, round(h * TW / w))), Image.LANCZOS)
                  if im.mode not in ('RGB', 'L'): im = im.convert('RGB')
                  im.save(out, 'JPEG', quality=TQ, optimize=True, progressive=True)
                  tn += 1
              except Exception as e:
                  print('縮小できず:', p, e)
          # 元が消えた縮小版は片づける
          for t in glob.glob('assets/artworks/thumb/*.jpg'):
              if not os.path.exists('assets/artworks/' + os.path.basename(t)):
                  os.remove(t)
                  stamps.pop(os.path.basename(t), None)
          _json.dump(stamps, open(STAMP, 'w'), indent=1, sort_keys=True)
          print('縮小版を', tn, '枚作った')
          EOF

      # 掲載済みの一覧は fetch-artworks.mjs が「マニフェストにあり、かつ
      # 画像が実在するID」から作る。ここでディレクトリを走査して作り直していたので、
      # マニフェストから外したIDが画像ファイルごと復活していた
      # （dotaku-kesadasuki・jomon-kaen-doki・todaiji-fukukensaku-kannon・yayoi-tsubo の4件）。
      # だから作り直さず、突き合わせて食い違いを報せるだけにする。
      - name: マニフェストと画像の食い違いを調べる
        run: |
          node -e "
            const fs=require('fs');
            const man=JSON.parse(fs.readFileSync('data/artworks.json','utf8'));
            const baked=JSON.parse(fs.readFileSync('data/artworks-baked.json','utf8'));
            const files=new Set(fs.readdirSync('assets/artworks')
              .filter(f=>/[.](jpg|png|webp|svg)$/i.test(f)).map(f=>f.replace(/[.][^.]+$/,'')));
            const orphan=[...files].filter(i=>!(i in man)).sort();
            const nofile=Object.keys(man).filter(i=>!files.has(i)).sort();
            console.log('マニフェスト', Object.keys(man).length, '／掲載済み', baked.length);
            if(orphan.length) console.log('マニフェストに無い画像:', orphan.join(', '));
            if(nofile.length) console.log('画像が無い作品:', nofile.join(', '));
            const bad=baked.filter(i=>!(i in man));
            if(bad.length){ console.error('掲載済み一覧にマニフェスト外のIDがあります:', bad.join(', ')); process.exit(1); }
          "

      # 掲載済み一覧が変わるので、ファイルから開く用の同梱も作り直す
      - name: 同梱データを作り直す
        run: node tools/bundle.mjs

      - name: 取得した画像をコミットする
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/artworks data/artworks.json data/artworks-baked.json data/glossary.json data/artworks-provenance.json data/bundle.js
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "作品画像を取得（自動）"
          # 取得のあいだに誰かが同じブランチへ push していると、
          # ここが non-fast-forward で弾かれる。取り直してから載せ直す。
          # 強制 push はしない。人の仕事を消すことになる。
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push が弾かれました（$i 回目）。取り直します。"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || exit 1
          done
          echo "3回試しても push できませんでした。" >&2
          exit 1
