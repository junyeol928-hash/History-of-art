name: 作品画像を取得する

on:
  workflow_dispatch:
    inputs:
      force:
        description: 取得済みのものも取り直す
        type: boolean
        default: false
  push:
    branches: [ main, 'claude/**' ]
    paths:
      - 'data/art/**'
      - 'tools/fetch-artworks.mjs'

permissions:
  contents: write

concurrency:
  group: artworks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: マニフェストを束ねる
        run: node tools/merge.mjs

      - name: Wikimedia から画像を取得する
        run: node tools/fetch-artworks.mjs ${{ inputs.force && '--force' || '' }}

      - name: 取得した画像をコミットする
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/artworks data/artworks.json data/artworks-baked.json data/glossary.json
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "作品画像を取得（自動）"
            git push
          fi
